<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Laxman Super Phone</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#111}.wrap{max-width:720px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 30px #0000000d}button{padding:12px 16px;border:0;border-radius:12px;background:#111;color:#fff}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:12px;margin:8px 0}pre{white-space:pre-wrap;overflow:auto}</style></head><body><main class="wrap"><h1>⚡ Laxman Super Phone</h1><p>AI control center · V1–V10</p><section class="card"><strong>Gateway</strong><p id="status">Checking…</p><button onclick="health()">Refresh</button></section><section class="card"><strong>Command</strong><input id="cmd" placeholder="e.g. check github"><button onclick="send()">Run</button><pre id="out"></pre></section><section class="card"><strong>Agents</strong><pre id="agents">Loading…</pre></section></main><script>const base=localStorage.lspUrl||'http://127.0.0.1:8787';const token=localStorage.lspToken||'';const h={'Authorization':'Bearer '+token,'Content-Type':'application/json'};async function health(){try{const r=await fetch(base+'/health',{headers:h});document.querySelector('#status').textContent=await r.text()}catch(e){document.querySelector('#status').textContent='Gateway unavailable'}}async function send(){const command=document.querySelector('#cmd').value;const r=await fetch(base+'/command',{method:'POST',headers:h,body:JSON.stringify({command,source:'dashboard'})});document.querySelector('#out').textContent=await r.text()}async function load(){try{const r=await fetch(base+'/agents',{headers:h});document.querySelector('#agents').textContent=JSON.stringify(await r.json(),null,2)}catch(e){}}health();load();</script></body></html>
