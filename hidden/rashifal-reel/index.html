<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#070711">
<meta name="description" content="आजको नेपाली मिति, तिथि र दैनिक राशिफल — cinematic reel view">
<title>आजको राशिफल · Cinematic Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="cinema" id="cinema">
  <div class="ambient"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="grain"></div>
  <div class="top-ui">
    <div class="brand"><span class="brand-dot"></span><span>LAXMAN</span></div>
    <div class="progress" id="progress"></div>
    <div class="sound" id="motionHint">SWIPE / ENTER</div>
  </div>
  <main id="slides" class="slides" aria-live="polite"></main>
  <div class="bottom-ui">
    <div id="status">आजको नेपाली राशिफल</div>
    <div class="gesture"><i></i><span>UP / DOWN</span></div>
  </div>
  <div class="loading" id="loading"><div class="spinner"></div><span>आजको विवरण तयार हुँदैछ…</span></div>
  <div class="toast" id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
